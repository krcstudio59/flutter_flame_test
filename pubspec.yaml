name: flutter_flame_test
description: A new Flutter project
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.3.1
  flame_audio: ^2.0.5 # Flame ses motoru bağımlılığı
  flame_forge2d: ^0.12.0 # Flame fizik motoru bağımlılığı
  flame_svg: ^1.2.2 # Flame SVG desteği bağımlılığı
  flame_tiled: ^1.3.1 # Flame Tiled harita desteği bağımlılığı
  google_fonts: ^6.2.1 # Google fontları bağımlılığı
  font_awesome_flutter: ^10.8.0
  flutter_screenutil: ^5.9.3
  



  # Add other dependencies here

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Add other assets here
  assets:
  - assets/images/
  - assets/sounds/
  - assets/fonts/
  - assets/animations/
  - assets/data/
  - assets/shaders/
  - assets/maps/
  - assets/tiles/maps/
  - assets/levels/brick_matrix.txt